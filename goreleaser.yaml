version: 2
project_name: rntocase
builds:
  -
    id: "rntocase"
    binary: "rntocase"
    dir: cmd/rntocase
    env:
      - CGO_ENABLED=0
archives:
  -
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
nfpms:
  -
    vendor: Ubels Software Development
    homepage: https://github.com/arran4/
    maintainer: Arran Ubels <arran@ubels.com.au>
    description: NA
    license: Private
    formats:
      - apk
      - deb
      - rpm
      - termux.deb
      - archlinux
    release: 1
    section: default
    priority: extra
dockers:
  - id: tools
    goos: linux
    goarch: amd64
    ids:
      - rntocase
    image_templates:
      - "ghcr.io/arran4/rntocase:{{ .Tag }}"
      - "ghcr.io/arran4/rntocase:latest"
    dockerfile: Dockerfile
    use: buildx

homebrew_casks:
  - repository:
      owner: arran4
      name: homebrew-tap
      branch: "{{.ProjectName}}-{{.Version}}"
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
